<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#f39c12" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Target Crosshair Rings -->
  <circle cx="96" cy="96" r="62" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="96" cy="96" r="42" fill="none" stroke="#f39c12" stroke-width="2.5" opacity="0.8"/>
  <circle cx="96" cy="96" r="20" fill="none" stroke="#f39c12" stroke-width="1.5" opacity="0.6"/>
  <circle cx="96" cy="96" r="4" fill="#f39c12" filter="url(#glow)"/>
  
  <!-- Crosshair Spikes -->
  <line x1="96" y1="24" x2="96" y2="48" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="144" x2="96" y2="168" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="96" x2="48" y2="96" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <line x1="144" y1="96" x2="168" y2="96" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stylized Katana / Blade Accent -->
  <path d="M54 138 L138 54" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M50 142 L62 130" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>
</svg>
