<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241a10"/>
      <stop offset="60%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#050404"/>
    </radialGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#f39c12" stroke-width="8" stroke-opacity="0.8"/>
  <!-- Target Crosshair Rings -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#f39c12" stroke-width="4" stroke-dasharray="16,10" opacity="0.45"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#f39c12" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="#f39c12" stroke-width="3.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="10" fill="#f39c12" filter="url(#glow512)"/>
  
  <!-- Crosshair Spikes -->
  <line x1="256" y1="56" x2="256" y2="128" stroke="#f39c12" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="384" x2="256" y2="456" stroke="#f39c12" stroke-width="7" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="128" y2="256" stroke="#f39c12" stroke-width="7" stroke-linecap="round"/>
  <line x1="384" y1="256" x2="456" y2="256" stroke="#f39c12" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Stylized Katana / Blade Accent -->
  <path d="M144 368 L368 144" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
  <path d="M136 376 L166 346" stroke="#f39c12" stroke-width="16" stroke-linecap="round"/>
  <circle cx="178" cy="334" r="7" fill="#f39c12"/>
</svg>
